name: main

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: "The version to use"
        required: true
        default: "0.0.0-test"
        type: string
      force_release:
        description: "Force release to nuget.org"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

env:
  # Setting these variables allows .NET CLI to use rich color codes in console output
  TERM: xterm
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Skip boilerplate output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Determine version
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Determine stable version
        id: stable-version
        if: ${{ github.event_name == 'release' }}
        env:
          # Passed via the environment rather than interpolated into the script:
          # a ${{ }} expression is substituted into the script text before bash
          # runs it, so a hostile tag name could break out of the string below
          # -- including out of the validation check itself.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z].*)?$ ]]; then
              echo "Invalid version: $TAG_NAME"
              exit 1
          fi

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease version
        id: pre-version
        if: ${{ github.event_name != 'release' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "version=0.0.0-ci-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ github.event.inputs.force_version || steps.stable-version.outputs.version || steps.pre-version.outputs.version }}

  # Check formatting
  #   format:
  #     runs-on: ubuntu-latest
  #     permissions:
  #       contents: read

  #     steps:
  #       - name: Checkout
  #         uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0

  #       - name: Install .NET
  #         uses: actions/setup-dotnet@607fce577a46308457984d59e4954e075820f10a # v3.0.3

  #       - name: Validate format
  #         run: dotnet format --verify-no-changes

  # Run tests
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Run restore
        run: dotnet restore

      - name: Run build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-restore
          --no-build
          --configuration Release
          ${{ runner.os == 'Windows' && '-p:IncludeNetCoreAppTargets=false' || '' }}
          --logger "trx;LogFileName=pw-test-results.trx"
          --collect:"XPlat Code Coverage"
          --
          RunConfiguration.CollectSourceInformation=true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Pack the output into NuGet packages
  pack:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Run restore
        run: dotnet restore

      - name: Run build
        env:
          # See the note in the version job: force_version is caller-supplied
          # and reaches this script unvalidated, so keep it out of the script
          # text. This job builds the .nupkg that deploy-nuget publishes.
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet build
          --no-restore
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          "-p:Version=$VERSION"

      - name: Run pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack
          "-p:Version=$VERSION"
          -p:ContinuousIntegrationBuild=true
          --no-restore
          --no-build
          --configuration Release

      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: packages
          path: "**/*.nupkg"

  # Publish to the GitHub package registry every time, whether it's a prerelease
  # version or a stable release version.
  deploy:
    needs:
      # Technically, it's not required for the format job to succeed for us to push the package,
      # so we may consider removing it as a prerequisite here.
      #   - format
      - test
      - pack

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Publish packages (GitHub Registry)
        continue-on-error: true
        run: >
          dotnet nuget push **/*.nupkg
          --source https://nuget.pkg.github.com/passwordless-lib/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

  # Publish to nuget.org on stable releases only, via Trusted Publishing.
  #
  # This job is deliberately separate from the one above and kept to two steps:
  # it is the only job in this workflow that may mint a nuget.org credential, so
  # `id-token: write` stays scoped to it rather than sitting at workflow level
  # where the test matrix and any third-party action could reach it.
  #
  # The `environment` is load-bearing, not decorative. nuget.org's Trusted
  # Publishing policy matches on repository owner, repository and workflow
  # filename -- it has no branch or tag field -- and a `workflow_dispatch` or
  # `pull_request` run uses the workflow file from *that* ref. Without an
  # environment whose deployment rules are restricted to main and release tags,
  # any branch carrying a file named main.yml could mint a real publishing key.
  # Configure the `nuget-release` environment to allow only `main` and the
  # release tag pattern, and set the same environment name on the nuget.org
  # policy so a token without that claim is rejected. Do not add
  # `refs/pull/*/merge` to those rules.
  deploy-nuget:
    needs:
      - test
      - pack

    # github.event.inputs.* comes from the raw event payload, where dispatch
    # inputs are strings -- and every non-empty string is truthy in a GitHub
    # expression, so a bare `github.event.inputs.force_release` was true even
    # with the box unchecked. Compare against the string explicitly.
    if: ${{ github.event_name == 'release' || github.event.inputs.force_release == 'true' }}

    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      # Temporary keys are valid for one hour, so request one immediately
      # before the push rather than earlier in the job.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages (NuGet Registry)
        run: >
          dotnet nuget push **/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

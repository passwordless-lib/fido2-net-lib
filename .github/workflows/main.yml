name: main

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: "The version to use"
        required: true
        default: "0.0.0-test"
        type: string
      force_release:
        description: "Force release to nuget.org"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

env:
  # Setting these variables allows .NET CLI to use rich color codes in console output
  TERM: xterm
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Skip boilerplate output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Determine version
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Determine stable version
        id: stable-version
        if: ${{ github.event_name == 'release' }}
        env:
          # Passed via the environment rather than interpolated into the script:
          # a ${{ }} expression is substituted into the script text before bash
          # runs it, so a hostile tag name could break out of the string below
          # -- including out of the validation check itself.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z].*)?$ ]]; then
              echo "Invalid version: $TAG_NAME"
              exit 1
          fi

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease version
        id: pre-version
        if: ${{ github.event_name != 'release' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "version=0.0.0-ci-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ github.event.inputs.force_version || steps.stable-version.outputs.version || steps.pre-version.outputs.version }}

  # Check formatting
  #   format:
  #     runs-on: ubuntu-latest
  #     permissions:
  #       contents: read

  #     steps:
  #       - name: Checkout
  #         uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0

  #       - name: Install .NET
  #         uses: actions/setup-dotnet@607fce577a46308457984d59e4954e075820f10a # v3.0.3

  #       - name: Validate format
  #         run: dotnet format --verify-no-changes

  # Run tests
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Run restore
        run: dotnet restore

      - name: Run build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-restore
          --no-build
          --configuration Release
          ${{ runner.os == 'Windows' && '-p:IncludeNetCoreAppTargets=false' || '' }}
          --logger "trx;LogFileName=pw-test-results.trx"
          --collect:"XPlat Code Coverage"
          --
          RunConfiguration.CollectSourceInformation=true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Pack the output into NuGet packages
  pack:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Run restore
        run: dotnet restore

      - name: Run build
        env:
          # See the note in the version job: force_version is caller-supplied
          # and reaches this script unvalidated, so keep it out of the script
          # text. This job builds the .nupkg that deploy-nuget publishes.
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet build
          --no-restore
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          "-p:Version=$VERSION"

      - name: Run pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack
          "-p:Version=$VERSION"
          -p:ContinuousIntegrationBuild=true
          --no-restore
          --no-build
          --configuration Release

      # Fido2.WithoutNSec is the same Src/Fido2/Fido2.csproj, packed a second time with the Fido2.NSec
      # dependency and its own project reference left out -- see Documentation/building-without-nsec.md. Its
      # own restore/build/pack sequence (rather than reusing the one above) is deliberate: overriding
      # PackageId on an already-restored, already-built project produces a NuGet "ambiguous project name"
      # error, confirmed while developing this locally. A separate obj/bin (via -p:BaseIntermediateOutputPath)
      # keeps this from clobbering the normal Fido2 package's own build output, which the step above still
      # needs to exist afterwards.
      #
      # PackageId/AssemblyName are NOT passed here as -p: overrides: Fido2.csproj's own
      # Condition="'$(ExcludeFido2NSec)' == 'true'" PropertyGroup sets them instead. A global MSBuild
      # property propagates into every referenced project in the build graph, so passing
      # -p:AssemblyName=Fido2.WithoutNSec here previously renamed Fido2.Models' own assembly to
      # Fido2.WithoutNSec too -- confirmed via a real pack and a clean consumer app, which threw
      # ReflectionTypeLoadException trying to load a type from the mis-named Fido2.Models assembly.
      #
      # -p:BaseIntermediateOutputPath, unlike PackageId/AssemblyName, still has to be passed as a global
      # override here (restore reads it before the project body is parsed, so setting it inside Fido2.csproj
      # doesn't work for that). It still propagates into Fido2.Models as a referenced project, which exposed
      # a second, independent bug: the "Run build"/"Run pack" steps above already generated
      # Src/Fido2.Models/obj/Release/.../Fido2.Models.AssemblyInfo.cs under the *default* intermediate path.
      # Once this step changes BaseIntermediateOutputPath to obj/WithoutNSec/, the SDK's default Compile-glob
      # exclude (which is derived from the *current* BaseIntermediateOutputPath) no longer matches that old
      # default path, so the implicit "**/*.cs" glob picks the stale generated file back up alongside the
      # freshly-regenerated one under obj/WithoutNSec/ -- CS0579 duplicate assembly attributes. Confirmed by
      # reproducing it locally in the same build order CI uses, and confirmed the cleanup below fixes it.
      # Deletes the whole default obj/ directory (every configuration, not just obj/Release -- any stray
      # generated source under obj/ would collide the same way) and never touches bin/Release, where the
      # normal packages' .nupkg files already live from the "Run pack" step above and are still needed
      # afterward.
      - name: Run restore, build and pack Fido2.WithoutNSec
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rm -rf Src/Fido2/obj Src/Fido2.Models/obj
          dotnet restore Src/Fido2/Fido2.csproj \
            -p:ExcludeFido2NSec=true \
            -p:BaseIntermediateOutputPath=obj/WithoutNSec/
          dotnet build Src/Fido2/Fido2.csproj \
            --no-restore \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            -p:ExcludeFido2NSec=true \
            -p:BaseIntermediateOutputPath=obj/WithoutNSec/ \
            -p:BaseOutputPath=bin/WithoutNSec/ \
            "-p:Version=$VERSION"
          dotnet pack Src/Fido2/Fido2.csproj \
            --no-restore \
            --no-build \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            -p:ExcludeFido2NSec=true \
            -p:BaseIntermediateOutputPath=obj/WithoutNSec/ \
            -p:BaseOutputPath=bin/WithoutNSec/ \
            "-p:Version=$VERSION"

      # Confirms Fido2.WithoutNSec really does omit NSec.Cryptography, not just from its own dependency
      # list -- a regression here would mean the ExcludeFido2NSec condition in Fido2.csproj stopped working.
      # The patterns below are deliberately more specific than a bare "nsec" grep: the package's own ID,
      # "Fido2.WithoutNSec", contains "NSec" as a substring, and a loose match flags itself as a false
      # positive (caught by testing this check locally before adding it here).
      - name: Check Fido2.WithoutNSec has no NSec.Cryptography dependency or reference
        run: |
          pkg=$(ls Src/Fido2/bin/WithoutNSec/Release/Fido2.WithoutNSec.*.nupkg)
          unzip -p "$pkg" 'Fido2.WithoutNSec.nuspec' | grep -qiE 'NSec\.Cryptography|"Fido2\.NSec"' \
            && { echo "::error::$pkg's nuspec depends on NSec.Cryptography or Fido2.NSec"; exit 1; }
          unzip -p "$pkg" 'lib/net8.0/Fido2.WithoutNSec.dll' | strings | grep -qiE '^NSec$|NSec\.Cryptography' \
            && { echo "::error::$pkg's assembly still references NSec.Cryptography"; exit 1; }
          echo "Confirmed: no NSec.Cryptography dependency or assembly reference."

      # Fido2.AspNet.WithoutNSec is the ASP.NET counterpart: referencing plain Fido2.AspNet alongside
      # Fido2.WithoutNSec would otherwise silently reintroduce NSec.Cryptography through Fido2.AspNet's own
      # ProjectReference to Fido2.csproj (the #660 review feedback that prompted this package). Same mechanism
      # as Fido2.WithoutNSec above: ExcludeFido2NSec, passed globally, propagates into Fido2.AspNet's
      # ProjectReference to Fido2.csproj, so it ends up depending on Fido2.WithoutNSec automatically via
      # Fido2.csproj's own conditional PackageId -- nothing Fido2.AspNet-specific needed beyond its own
      # matching PackageId/AssemblyName PropertyGroup. The same stale-obj cleanup applies, now including
      # Fido2.AspNet's own obj/ alongside Fido2's and Fido2.Models'.
      - name: Run restore, build and pack Fido2.AspNet.WithoutNSec
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rm -rf Src/Fido2/obj Src/Fido2.Models/obj Src/Fido2.AspNet/obj
          dotnet restore Src/Fido2.AspNet/Fido2.AspNet.csproj \
            -p:ExcludeFido2NSec=true \
            -p:BaseIntermediateOutputPath=obj/WithoutNSec/
          dotnet build Src/Fido2.AspNet/Fido2.AspNet.csproj \
            --no-restore \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            -p:ExcludeFido2NSec=true \
            -p:BaseIntermediateOutputPath=obj/WithoutNSec/ \
            -p:BaseOutputPath=bin/WithoutNSec/ \
            "-p:Version=$VERSION"
          dotnet pack Src/Fido2.AspNet/Fido2.AspNet.csproj \
            --no-restore \
            --no-build \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            -p:ExcludeFido2NSec=true \
            -p:BaseIntermediateOutputPath=obj/WithoutNSec/ \
            -p:BaseOutputPath=bin/WithoutNSec/ \
            "-p:Version=$VERSION"

      - name: Check Fido2.AspNet.WithoutNSec has no NSec.Cryptography dependency or reference
        run: |
          pkg=$(ls Src/Fido2.AspNet/bin/WithoutNSec/Release/Fido2.AspNet.WithoutNSec.*.nupkg)
          unzip -p "$pkg" 'Fido2.AspNet.WithoutNSec.nuspec' | grep -qiE 'NSec\.Cryptography|"Fido2\.NSec"|"Fido2"' \
            && { echo "::error::$pkg's nuspec depends on NSec.Cryptography, Fido2.NSec, or plain Fido2"; exit 1; }
          unzip -p "$pkg" 'lib/net8.0/Fido2.AspNet.WithoutNSec.dll' | strings | grep -qiE '^NSec$|NSec\.Cryptography' \
            && { echo "::error::$pkg's assembly still references NSec.Cryptography"; exit 1; }
          echo "Confirmed: no NSec.Cryptography dependency or assembly reference, and depends on Fido2.WithoutNSec."

      # Exercises the built packages the way a real consumer would, rather than just inspecting a nupkg
      # directly -- the check above wouldn't have caught the AssemblyName-propagation bug from #660 review
      # feedback: a Fido2.Models assembly silently renamed to Fido2.WithoutNSec still "looks right" in a
      # nuspec/DLL-string inspection, it only breaks the instant something calls GetTypes() on it. Three
      # scenarios, each restored from a local feed of exactly the nupkgs built above, each run (not just
      # built) on both net8.0 and net10.0:
      #   - Fido2 alone supports Ed25519 out of the box.
      #   - Fido2.WithoutNSec alone does not, and its actual restore/publish output (project.assets.json plus
      #     every output file, not just the nuspec) carries no NSec.Cryptography/libsodium/Bouncy Castle
      #     identifier -- deliberately more specific than a bare "nsec" grep, since "Fido2.WithoutNSec" itself
      #     contains "NSec" as a substring (same pitfall as the check above, caught by testing against a
      #     deliberately-broken scenario locally before trusting this).
      #   - Adding Fido2.NSec back to Fido2.WithoutNSec restores Ed25519 support, without switching to Fido2.
      #   - Fido2.AspNet.WithoutNSec repeats the WithoutNSec/plusNSec pair, confirming Fido2.AspNet's own
      #     ProjectReference to Fido2.csproj doesn't reintroduce NSec via a second, independent path.
      - name: Verify the packed Fido2/Fido2.AspNet (With and Without NSec) packages end-to-end
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          feed="$RUNNER_TEMP/local-feed"
          mkdir -p "$feed"
          cp Src/Fido2.Models/bin/Release/*.nupkg "$feed/"
          cp Src/Fido2/bin/Release/*.nupkg "$feed/"
          cp Src/Fido2.NSec/bin/Release/*.nupkg "$feed/"
          cp Src/Fido2/bin/WithoutNSec/Release/*.nupkg "$feed/"
          cp Src/Fido2.AspNet/bin/Release/*.nupkg "$feed/"
          cp Src/Fido2.AspNet/bin/WithoutNSec/Release/*.nupkg "$feed/"

          FORBIDDEN_PATTERN='NSec\.Cryptography|"Fido2\.NSec"|libsodium|bouncycastle'

          write_nuget_config() {
            cat > "$1/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feed" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          }

          # $1 = scenario name, $2 = extra PackageReference lines, $3 = expected Ed25519Available (True/False),
          # $4 = "audit" to also fail if a forbidden dependency identifier shows up in the restore/publish output
          run_scenario() {
            local name=$1 refs=$2 expect_available=$3 mode=${4:-}
            local dir="$RUNNER_TEMP/$name"
            rm -rf "$dir"
            mkdir -p "$dir"
            write_nuget_config "$dir"
            cat > "$dir/app.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFrameworks>net8.0;net10.0</TargetFrameworks>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
            </ItemGroup>
            <ItemGroup>
              <PackageReference Include="Fido2.Models" Version="$VERSION" />
          $refs
            </ItemGroup>
          </Project>
          EOF
            cat > "$dir/Program.cs" <<'PROG'
          var modelsTypes = typeof(Fido2NetLib.OkpSignatureVerifiers).Assembly.GetTypes();
          Console.WriteLine($"Loaded {modelsTypes.Length} types from Fido2.Models without error.");

          // Fido2NetLib.Fido2 lives in the main Fido2/Fido2.WithoutNSec assembly, not Fido2.Models -- loading
          // every type from it directly (not just constructing one, below) is what would have caught the
          // AssemblyName-propagation release blocker without needing a dedicated repro: that bug renamed
          // Fido2.Models' assembly, not this one, but a similar corruption in Fido2 itself could otherwise
          // pass every other check here while still throwing ReflectionTypeLoadException on a real consumer.
          var fido2Types = typeof(Fido2NetLib.Fido2).Assembly.GetTypes();
          Console.WriteLine($"Loaded {fido2Types.Length} types from Fido2/Fido2.WithoutNSec without error.");

          // Constructs a real Fido2NetLib.Fido2 (not just a Fido2.Models type) so a trimmed publish of this
          // program has a genuine static reference into the Fido2 assembly itself -- without that, the
          // trimmer removes Fido2.dll as unreferenced, which would make a later check for Fido2.NSec.dll's
          // presence meaningless rather than a real test of whether it gets trimmed away.
          _ = new Fido2NetLib.Fido2(new Fido2NetLib.Fido2Configuration
          {
              RPID = "example.com",
              RPName = "example",
              Origins = new HashSet<string> { "https://example.com" },
          });

          var available = Fido2NetLib.OkpSignatureVerifiers.Find(Fido2NetLib.Objects.COSE.EllipticCurve.Ed25519) is not null;
          Console.WriteLine($"Ed25519Available={available}");
          PROG
            echo "=== $name ==="
            (cd "$dir" && dotnet restore --verbosity quiet)
            for tfm in net8.0 net10.0; do
              (cd "$dir" && dotnet run --no-restore -f "$tfm" --verbosity quiet) > "$dir/out.$tfm.log" 2>&1 \
                || { cat "$dir/out.$tfm.log"; echo "::error::$name ($tfm) did not run"; exit 1; }
              cat "$dir/out.$tfm.log"
              if ! grep -q "Ed25519Available=$expect_available" "$dir/out.$tfm.log"; then
                echo "::error::$name ($tfm) expected Ed25519Available=$expect_available"
                exit 1
              fi
            done
            if [[ "$mode" == "audit" ]]; then
              if grep -qiE "$FORBIDDEN_PATTERN" "$dir/obj/project.assets.json"; then
                echo "::error::$name's project.assets.json references a forbidden dependency"
                grep -iE "$FORBIDDEN_PATTERN" "$dir/obj/project.assets.json"
                exit 1
              fi
              for tfm in net8.0 net10.0; do
                if find "$dir/bin/Debug/$tfm" -type f | grep -qiE "$FORBIDDEN_PATTERN"; then
                  echo "::error::$name's $tfm output directory contains a forbidden dependency's file"
                  find "$dir/bin/Debug/$tfm" -type f | grep -iE "$FORBIDDEN_PATTERN"
                  exit 1
                fi
              done
            fi
            echo "OK: $name"
          }

          run_scenario "fido2-default"        "    <PackageReference Include=\"Fido2\" Version=\"$VERSION\" />"                                                                                   True
          run_scenario "withoutnsec-bare"     "    <PackageReference Include=\"Fido2.WithoutNSec\" Version=\"$VERSION\" />"                                                                      False audit
          run_scenario "withoutnsec-plusnsec" $'    <PackageReference Include="Fido2.WithoutNSec" Version="'"$VERSION"$'" />\n    <PackageReference Include="Fido2.NSec" Version="'"$VERSION"$'" />' True
          run_scenario "aspnet-withoutnsec"   "    <PackageReference Include=\"Fido2.AspNet.WithoutNSec\" Version=\"$VERSION\" />"                                                                 False audit
          run_scenario "aspnet-withoutnsec-plusnsec" $'    <PackageReference Include="Fido2.AspNet.WithoutNSec" Version="'"$VERSION"$'" />\n    <PackageReference Include="Fido2.NSec" Version="'"$VERSION"$'" />' True

          # A self-contained trimmed publish is a separate code path from a plain `dotnet run` above: the
          # trimmer removes any assembly it finds no static reference to, and OkpSignatureVerifiers loads
          # Fido2.NSec purely by name via reflection, so a plain Fido2 consumer's trimmed publish silently lost
          # Fido2.NSec.dll (and EdDSA support) until build/fido2.targets rooted it conditionally on
          # @(ReferencePath) actually containing it (see that file's own remarks) -- confirmed with a real
          # `dotnet publish -p:PublishTrimmed=true -p:SelfContained=true` against a packed nupkg before fixing
          # it, so this asserts the fix rather than just the original problem.
          # $1 = scenario name (reuses the app.csproj/Program.cs already written by run_scenario above),
          # $2 = expected Ed25519Available (True/False), $3 = "present" or "absent" for Fido2.NSec.dll in the
          # trimmed publish output
          run_trim_scenario() {
            local name=$1 expect_available=$2 expect_nsec_dll=$3
            local dir="$RUNNER_TEMP/$name"
            echo "--- $name (trimmed, self-contained) ---"
            (cd "$dir" && dotnet publish -f net8.0 -c Release -r linux-x64 --self-contained -p:PublishTrimmed=true --verbosity quiet)
            local pub="$dir/bin/Release/net8.0/linux-x64/publish"
            local has_nsec=False
            [[ -f "$pub/Fido2.NSec.dll" ]] && has_nsec=True
            if [[ "$expect_nsec_dll" == "present" && "$has_nsec" != "True" ]]; then
              echo "::error::$name's trimmed publish is missing Fido2.NSec.dll"
              ls "$pub"
              exit 1
            fi
            if [[ "$expect_nsec_dll" == "absent" && "$has_nsec" == "True" ]]; then
              echo "::error::$name's trimmed publish unexpectedly contains Fido2.NSec.dll"
              exit 1
            fi
            local out
            out=$("$pub/app")
            echo "$out"
            if ! grep -q "Ed25519Available=$expect_available" <<< "$out"; then
              echo "::error::$name's trimmed publish expected Ed25519Available=$expect_available"
              exit 1
            fi
            echo "OK: $name (trimmed)"
          }

          run_trim_scenario "fido2-default"    True  present
          run_trim_scenario "withoutnsec-bare" False absent

          # The scenarios above only construct a bare Fido2NetLib.Fido2 directly; the ASP.NET integration's own
          # surface (AddFido2, IFido2NetLibBuilder, resolving IFido2 from a real container) is never exercised.
          # Loads every type in Fido2.AspNet(.WithoutNSec)'s own assembly, not just Fido2's, for the same reason
          # the main Program.cs now does that for Fido2 itself: constructing one object only touches the types
          # that one call path happens to need, GetTypes() fails if any type in the assembly is broken.
          # $1 = scenario name (reuses the app.csproj already written by run_scenario above)
          run_aspnet_di_scenario() {
            local name=$1
            local dir="$RUNNER_TEMP/$name"
            cat > "$dir/Program.cs" <<'PROG'
          using Microsoft.Extensions.DependencyInjection;

          var aspNetTypes = typeof(Fido2NetLibBuilderExtensions).Assembly.GetTypes();
          Console.WriteLine($"Loaded {aspNetTypes.Length} types from Fido2.AspNet/Fido2.AspNet.WithoutNSec without error.");

          var services = new ServiceCollection();
          services.AddFido2(options =>
          {
              options.RPID = "example.com";
              options.RPName = "example";
              options.Origins = new HashSet<string> { "https://example.com" };
          });
          using var provider = services.BuildServiceProvider();
          var fido2 = provider.GetRequiredService<Fido2NetLib.IFido2>();
          Console.WriteLine($"Resolved IFido2 from a real ServiceCollection: {fido2 is not null}");
          PROG
            echo "--- $name (AddFido2 via a real ServiceCollection) ---"
            for tfm in net8.0 net10.0; do
              (cd "$dir" && dotnet run --no-restore -f "$tfm" --verbosity quiet) > "$dir/out.di.$tfm.log" 2>&1 \
                || { cat "$dir/out.di.$tfm.log"; echo "::error::$name ($tfm) AddFido2 scenario did not run"; exit 1; }
              cat "$dir/out.di.$tfm.log"
              grep -q "Resolved IFido2 from a real ServiceCollection: True" "$dir/out.di.$tfm.log" \
                || { echo "::error::$name ($tfm) did not resolve IFido2 from a real ServiceCollection"; exit 1; }
            done
            echo "OK: $name (AddFido2)"
          }

          run_aspnet_di_scenario "aspnet-withoutnsec"
          run_aspnet_di_scenario "aspnet-withoutnsec-plusnsec"

          echo "All package-consumer scenarios passed."

      # Static web assets are enumerated when the project is evaluated, so anything a build step generates
      # into wwwroot afterwards is silently left out of the package (#633). Fail here rather than on NuGet.
      - name: Check Fido2.BlazorWebAssembly ships its JavaScript module
        run: |
          pkg=$(ls Src/Fido2.BlazorWebAssembly/bin/Release/Fido2.BlazorWebAssembly.*.nupkg)
          unzip -l "$pkg" | grep -q 'staticwebassets/js/WebAuthn.js$' || { echo "::error::$pkg is missing staticwebassets/js/WebAuthn.js"; unzip -l "$pkg"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: packages
          path: "**/*.nupkg"

  # Publish to the GitHub package registry every time, whether it's a prerelease
  # version or a stable release version.
  deploy:
    needs:
      # Technically, it's not required for the format job to succeed for us to push the package,
      # so we may consider removing it as a prerequisite here.
      #   - format
      - test
      - pack

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Publish packages (GitHub Registry)
        continue-on-error: true
        run: >
          dotnet nuget push **/*.nupkg
          --source https://nuget.pkg.github.com/passwordless-lib/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

  # Publish to nuget.org on stable releases only, via Trusted Publishing.
  #
  # This job is deliberately separate from the one above and kept to two steps:
  # it is the only job in this workflow that may mint a nuget.org credential, so
  # `id-token: write` stays scoped to it rather than sitting at workflow level
  # where the test matrix and any third-party action could reach it.
  #
  # The `environment` is load-bearing, not decorative. nuget.org's Trusted
  # Publishing policy matches on repository owner, repository and workflow
  # filename -- it has no branch or tag field -- and a `workflow_dispatch` or
  # `pull_request` run uses the workflow file from *that* ref. Without an
  # environment whose deployment rules are restricted to main and release tags,
  # any branch carrying a file named main.yml could mint a real publishing key.
  # Configure the `nuget-release` environment to allow only `main` and the
  # release tag pattern, and set the same environment name on the nuget.org
  # policy so a token without that claim is rejected. Do not add
  # `refs/pull/*/merge` to those rules.
  deploy-nuget:
    needs:
      - test
      - pack

    # github.event.inputs.* comes from the raw event payload, where dispatch
    # inputs are strings -- and every non-empty string is truthy in a GitHub
    # expression, so a bare `github.event.inputs.force_release` was true even
    # with the box unchecked. Compare against the string explicitly.
    if: ${{ github.event_name == 'release' || github.event.inputs.force_release == 'true' }}

    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      # Temporary keys are valid for one hour, so request one immediately
      # before the push rather than earlier in the job.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages (NuGet Registry)
        run: >
          dotnet nuget push **/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
